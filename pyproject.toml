[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remind-mcp"
version = "0.1.0"
description = "MCP server for the Linux remind calendar and reminder system"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.0.0",
    "psutil>=5.9.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
remind-mcp = "remind_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/remind_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
